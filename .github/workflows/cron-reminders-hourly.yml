name: Cron — reminders-hourly (manual/dispatch only — see v3.7.3)

# v3.6.9 tried this workflow's own `schedule:` trigger as a Vercel
# Hobby-compatible replacement for the every-15-minutes cadence
# vercel.json used to run natively on Pro. v3.7.3: measured directly
# against this repo's real run history and found GitHub's `schedule:`
# trigger does NOT deliver anything close to "every 15 minutes" in
# practice — real gaps between runs of 2-5+ hours, not 15 minutes.
# Confirmed live: a household-tagged event's hour-based reminder
# ("Papa Dentist," 1 hour before its 10am time) needed a run inside a
# single 1-hour window and got none — it never fired at all
# (docs/00-current-state.md's v3.7.3 section).
#
# Replaced with cron-job.org (free, purpose-built for exactly this,
# supports down to once-per-minute with custom headers) hitting
# /api/cron/reminders-hourly directly on its own schedule — see
# INSTALL.md for the exact setup. The `schedule:` trigger below is
# intentionally removed; `workflow_dispatch:` stays only for manual
# testing.
#
# Still requires the CRON_SECRET repository secret for manual runs —
# see INSTALL.md.

on:
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders-hourly
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://expdash.vercel.app/api/cron/reminders-hourly"
