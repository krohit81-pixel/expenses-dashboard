name: Cron — reminders (manual/dispatch only — see v3.7.3)

# v3.6.9 tried this workflow's own `schedule:` trigger as a Vercel
# Hobby-compatible replacement for the every-4-hours cadence
# vercel.json used to run natively on Pro. v3.7.3: measured directly
# against this repo's real run history and found GitHub's `schedule:`
# trigger does NOT deliver anything close to "every 4 hours" in
# practice — real gaps between runs of 3-7+ hours, not the ~4 hours
# configured (this repo runs THREE separate scheduled workflows,
# competing for GitHub's own lower-priority scheduled-run queue).
# Confirmed live: this degradation directly caused a household-tagged
# reminder to never fire (docs/00-current-state.md's v3.7.3 section).
#
# Replaced with cron-job.org (free, purpose-built for exactly this,
# supports down to once-per-minute with custom headers) hitting
# /api/cron/reminders directly on its own schedule — see INSTALL.md
# for the exact setup. The `schedule:` trigger below is intentionally
# removed; `workflow_dispatch:` stays only for manual testing.
#
# Still requires the CRON_SECRET repository secret for manual runs —
# see INSTALL.md.

on:
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/reminders
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://expdash.vercel.app/api/cron/reminders"
